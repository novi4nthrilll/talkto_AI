[project]
name = "talkto-ai"
version = "0.1.0"
description = "AI Web Agent — cari info di internet lewat browser, jawab dengan teks & suara."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "edge-tts>=6.1",
    "gTTS>=2.5",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
talkto = "talkto_ai.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["talkto_ai*"]

